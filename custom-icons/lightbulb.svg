<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Bombilla de luz con efecto brillante -->
  <defs>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base de la bombilla -->
  <rect x="26" y="46" width="12" height="8" rx="2" fill="#B0B0B0"/>
  <rect x="24" y="54" width="16" height="4" rx="2" fill="#808080"/>
  
  <!-- Cuerpo de la bombilla -->
  <path d="M 32 10 Q 22 15 22 28 Q 22 38 26 42 L 38 42 Q 42 38 42 28 Q 42 15 32 10 Z" 
        fill="url(#lightGradient)" 
        filter="url(#glow)"
        stroke="#FFA500" 
        stroke-width="1"/>
  
  <!-- Filamento -->
  <path d="M 32 18 L 32 32" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="#FF6B00"/>
  
  <!-- Brillo -->
  <circle cx="28" cy="20" r="2" fill="white" opacity="0.8"/>
  <circle cx="36" cy="24" r="1.5" fill="white" opacity="0.6"/>
</svg>
