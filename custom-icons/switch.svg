<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Interruptor de pared -->
  <defs>
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Placa del interruptor -->
  <rect x="12" y="8" width="40" height="48" rx="4" 
        fill="url(#switchGradient)" 
        stroke="#808080" 
        stroke-width="2"/>
  
  <!-- Sombra interna -->
  <rect x="14" y="10" width="36" height="44" rx="3" 
        fill="none" 
        stroke="#606060" 
        stroke-width="1" 
        opacity="0.3"/>
  
  <!-- Palanca del interruptor -->
  <rect x="24" y="20" width="16" height="24" rx="2" 
        fill="#4A90E2" 
        stroke="#2E5C8A" 
        stroke-width="2"/>
  
  <!-- Indicador ON/OFF -->
  <circle cx="32" cy="28" r="2" fill="#00FF00" opacity="0.8"/>
  
  <!-- Detalles de la palanca -->
  <line x1="28" y1="32" x2="36" y2="32" stroke="#2E5C8A" stroke-width="1.5"/>
  <line x1="28" y1="36" x2="36" y2="36" stroke="#2E5C8A" stroke-width="1.5"/>
</svg>
