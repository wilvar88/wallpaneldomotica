<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Enchufe/Toma de corriente -->
  <defs>
    <linearGradient id="outletGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Placa del enchufe -->
  <rect x="10" y="10" width="44" height="44" rx="6" 
        fill="url(#outletGradient)" 
        stroke="#A0A0A0" 
        stroke-width="2"/>
  
  <!-- Agujeros del enchufe (tipo americano) -->
  <rect x="24" y="22" width="4" height="12" rx="2" fill="#404040"/>
  <rect x="36" y="22" width="4" height="12" rx="2" fill="#404040"/>
  
  <!-- Agujero de tierra (redondo) -->
  <circle cx="32" cy="42" r="3" fill="#404040"/>
  
  <!-- Tornillos decorativos -->
  <circle cx="16" cy="16" r="2" fill="#808080"/>
  <circle cx="48" cy="16" r="2" fill="#808080"/>
  <circle cx="16" cy="48" r="2" fill="#808080"/>
  <circle cx="48" cy="48" r="2" fill="#808080"/>
  
  <!-- Líneas de los tornillos -->
  <line x1="15" y1="15" x2="17" y2="17" stroke="#606060" stroke-width="1"/>
  <line x1="47" y1="15" x2="49" y2="17" stroke="#606060" stroke-width="1"/>
  <line x1="15" y1="47" x2="17" y2="49" stroke="#606060" stroke-width="1"/>
  <line x1="47" y1="47" x2="49" y2="49" stroke="#606060" stroke-width="1"/>
</svg>
