<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ventilador -->
  <defs>
    <linearGradient id="fanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Centro del ventilador -->
  <circle cx="32" cy="32" r="6" fill="#1E40AF" stroke="#1E3A8A" stroke-width="2"/>
  
  <!-- Aspas del ventilador (3 aspas rotadas) -->
  <!-- Aspa 1 -->
  <ellipse cx="32" cy="16" rx="8" ry="14" 
           fill="url(#fanGradient)" 
           stroke="#2563EB" 
           stroke-width="1.5"
           opacity="0.9"/>
  
  <!-- Aspa 2 (rotada 120 grados) -->
  <ellipse cx="32" cy="16" rx="8" ry="14" 
           fill="url(#fanGradient)" 
           stroke="#2563EB" 
           stroke-width="1.5"
           opacity="0.9"
           transform="rotate(120 32 32)"/>
  
  <!-- Aspa 3 (rotada 240 grados) -->
  <ellipse cx="32" cy="16" rx="8" ry="14" 
           fill="url(#fanGradient)" 
           stroke="#2563EB" 
           stroke-width="1.5"
           opacity="0.9"
           transform="rotate(240 32 32)"/>
  
  <!-- Centro decorativo -->
  <circle cx="32" cy="32" r="4" fill="#3B82F6"/>
  <circle cx="32" cy="32" r="2" fill="#60A5FA"/>
  
  <!-- Indicador de movimiento (líneas circulares) -->
  <path d="M 32 8 A 24 24 0 0 1 52 20" 
        stroke="#93C5FD" 
        stroke-width="2" 
        stroke-linecap="round" 
        fill="none" 
        opacity="0.5"/>
</svg>
