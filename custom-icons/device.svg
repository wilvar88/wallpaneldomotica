<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dispositivo genérico -->
  <defs>
    <linearGradient id="deviceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cuerpo del dispositivo -->
  <rect x="12" y="12" width="40" height="40" rx="8" 
        fill="url(#deviceGradient)" 
        stroke="#6D28D9" 
        stroke-width="2"/>
  
  <!-- Pantalla/Display -->
  <rect x="18" y="18" width="28" height="16" rx="3" 
        fill="#1F2937" 
        opacity="0.8"/>
  
  <!-- Indicadores LED -->
  <circle cx="22" cy="26" r="2" fill="#10B981"/>
  <circle cx="28" cy="26" r="2" fill="#3B82F6"/>
  <circle cx="34" cy="26" r="2" fill="#F59E0B"/>
  
  <!-- Botones -->
  <circle cx="22" cy="42" r="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <circle cx="32" cy="42" r="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <circle cx="42" cy="42" r="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  
  <!-- Icono de dispositivo inteligente (wifi) -->
  <path d="M 32 22 Q 28 22 26 24" stroke="#60A5FA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 32 22 Q 36 22 38 24" stroke="#60A5FA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
